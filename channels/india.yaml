# ===========================================================================
# Lantern channel configuration — INDIA
# ===========================================================================
# Active config. Loaded by every pipeline module via lantern.config.load_channel("india").
# To add a new channel later: copy channels/example.yaml, edit, set ACTIVE_CHANNEL in .env.

# --- Channel identity -----------------------------------------------------
name: "By Lantern Light"          # Display name (used in tags, descriptions, dashboard)
slug: "india"                      # Used in file paths (output/india/, records/india/, etc.)
region: "IN"                       # ISO country code — passed to YouTube/pytrends APIs

# --- Content ---------------------------------------------------------------
niche: "practical wisdom for hard times"
themes:
  - stoic
  - buddhist
  - taoist
  - vedantic                       # universal philosophy; Indian-rooted sources welcome
language: "en"                     # English narration (Indian-English voice)

# --- Trend research (used by research.py) ---------------------------------
research:
  pytrends_geo: "IN"               # Google Trends region
  youtube_region_code: "IN"        # YouTube Data API regionCode
  candidates_per_run: 8            # How many topic candidates to surface per run

  # For each theme above, we search YouTube with theme + each modifier (e.g. "stoic wisdom").
  # Targeted queries surface deep-wisdom content instead of viral noise.
  query_modifiers:
    - "wisdom"
    - "for hard times"
    - "teachings"

  # Filter out Shorts and meme content
  exclude_shorts: true             # drop #shorts, #short, #tiktok titles + very short videos
  youtube_duration: "medium"       # search filter: any | short | medium (4-20min) | long
  min_video_seconds: 90            # post-filter: drop anything under N seconds

  # Language hygiene — region=IN returns lots of regional-language titles.
  # The filter drops titles in scripts the operator can't read. Devanagari (Hindi)
  # is INCLUDED in research (allowed through) because the operator reads Hindi.
  # See lantern/research.py NON_LATIN_RE to tweak the allowed/blocked scripts.
  exclude_non_latin_titles: true

# --- Script generation (used by script.py) --------------------------------
script:
  editor: "notepad"            # any executable on PATH; null = auto-detect (Windows -> notepad)
  word_count_target: 1300      # ~7-8 minutes at typical narration speed
  word_count_min: 900          # ~6 min floor
  word_count_max: 1700         # ~10 min ceiling

# Sections for later modules (voice, assemble, upload, instagram) will be
# appended here as each module is built. Missing sections fall back to safe
# defaults inside lantern/config.py.
