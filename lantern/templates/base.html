<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern — {% block title %}Review{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Lantern Dashboard</h1>
    <p class="channel-meta">
      Channel: <strong>{{ channel.name }}</strong>
      ({{ channel.slug }}, region {{ channel.region }}, voice {{ channel.voice.primary }})
    </p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Nothing here uploads to YouTube. Approve marks the draft as queue-ready
    for <code>upload.py</code>; you still click Publish in YouTube Studio.</p>
  </footer>
</body>
</html>
